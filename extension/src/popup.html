<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZapWebp Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-box">
        <svg class="bolt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
      </div>
      <div>
        <h1 class="title">ZapWebp</h1>
        <p class="subtitle">Quick Image Converter</p>
      </div>
    </header>

    <!-- Usage Guide -->
    <section class="instructions-card">
      <h2 class="card-title">How to use:</h2>
      <ol class="step-list">
        <li>Right-click on any web image.</li>
        <li>Select <span class="highlight">"ZapWebp: Save image as PNG"</span> or <span class="highlight">"Save image as JPG"</span>.</li>
        <li>Your image converts instantly and saves to your downloads!</li>
      </ol>
    </section>

    <!-- Badges -->
    <div class="badges-row">
      <span class="badge badge-emerald">
        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        100% In-Browser
      </span>
      <span class="badge badge-fuchsia">
        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
        Instant Speed
      </span>
    </div>

    <!-- Actions / Links -->
    <footer class="footer-actions">
      <a href="https://zapwebp.pages.dev" target="_blank" rel="noopener noreferrer" class="btn btn-primary" id="open-webapp-link">
        Open Full Web App
      </a>

      <a href="https://ko-fi.com/scaddy00" target="_blank" rel="noopener noreferrer" class="btn btn-kofi" id="open-kofi-link" aria-label="Support the developer on Ko-fi">
        <svg class="kofi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
          <line x1="6" x2="6" y1="2" y2="4" />
          <line x1="10" x2="10" y1="2" y2="4" />
          <line x1="14" x2="14" y1="2" y2="4" />
        </svg>
        Support on Ko-fi ☕
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
